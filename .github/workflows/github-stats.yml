name: Generate GitHub Stats Images

on:
  schedule:
    # Jalan otomatis tiap hari jam 00:00 UTC (07:00 WIB)
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # bisa di-trigger manual dari tab Actions
  push:
    branches:
      - main

jobs:
  generate-stats:
    name: Generate GitHub stats images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate stats images
        uses: jstrieb/github-stats@master
        with:
          username: Adam-Nurwahid
          exclude_repos: ""
          exclude_langs: ""
        env:
          # ACCESS_TOKEN harus dibuat manual di GitHub Settings > Developer settings
          # > Personal access tokens, lalu disimpan sebagai Repo Secret bernama ACCESS_TOKEN
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
